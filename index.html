<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="采气工刷题">
<meta name="theme-color" content="#2563eb">
<meta name="description" content="职业技能理论题库刷题练习">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text x='50' y='68' font-size='60' text-anchor='middle' fill='white'>⛽</text></svg>">
<title>职业技能理论刷题</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        primary: '#2563eb',
        'primary-dark': '#1d4ed8',
        danger: '#ef4444',
        success: '#22c55e',
        warning: '#f59e0b',
      }
    }
  }
}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
  .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .tab-bar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); max-width: 480px; }
  .page-view { display: none; padding-bottom: 80px; }
  .page-view.active { display: block; }
  .option-btn { transition: all 0.15s ease; }
  .option-btn:active { transform: scale(0.97); }
  .option-btn.correct { background-color: #16a34a !important; color: white !important; border-color: #16a34a !important; }
  .option-btn.wrong { background-color: #dc2626 !important; color: white !important; border-color: #dc2626 !important; }
  .option-btn.revealed { background-color: #e5e7eb !important; color: #6b7280 !important; }
  .drawer { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 100; display: none; }
  .drawer.open { display: block; }
  .drawer-content { position: absolute; left: 0; top: 0; bottom: 0; width: 85%; max-width: 360px; background: white; overflow-y: auto; transition: transform 0.3s; transform: translateX(-100%); }
  .drawer.open .drawer-content { transform: translateX(0); }
  .badge-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
  .fade-in { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
  .ai-loading { animation: pulse 1.5s infinite; }
  .ai-response { margin-top: 1rem; border-left: 3px solid #2563eb; padding-left: 1rem; background: #eff6ff; border-radius: 0.5rem; padding: 1rem; }
  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
  /* Scrollbar styling */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
</style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<div id="app" class="app-container relative bg-white shadow-sm">
  <!-- ========== HEADER ========== -->
  <header class="sticky top-0 bg-primary text-white px-4 py-3 flex items-center gap-3 z-50">
    <button id="headerBackBtn" class="hidden text-xl leading-none">&larr;</button>
    <h1 id="headerTitle" class="text-lg font-semibold flex-1">理论刷题</h1>
    <span id="headerBadge" class="text-xs bg-white/20 rounded-full px-2 py-0.5"></span>
  </header>

  <!-- ========== LOADING ========== -->
  <div id="loadingView" class="flex flex-col items-center justify-center py-20">
    <div class="animate-spin w-8 h-8 border-2 border-primary border-t-transparent rounded-full mb-4"></div>
    <p class="text-gray-500">加载题库中...</p>
  </div>

  <!-- ========== 1. HOME / MODE SELECT ========== -->
  <div id="homeView" class="page-view px-4 pt-4">
    <details class="mb-4 rounded-xl border border-gray-200 bg-gray-50">
      <summary class="p-3 cursor-pointer list-none flex items-center gap-2">
        <span>📚</span>
        <span class="text-sm text-gray-500">当前题库</span>
        <span id="activeBankTitle" class="font-medium text-sm flex-1 text-right"></span>
        <span class="text-gray-400">⌄</span>
      </summary>
      <div id="bankShelf" class="p-3 pt-0 space-y-2"></div>
    </details>
    <div class="text-center mb-6">
      <div class="text-3xl mb-2">⛽</div>
      <p class="text-gray-500 text-sm">题库共 <span id="homeTotalQ">0</span> 道可练习题</p>
    </div>
    <!-- Quick Stats -->
    <div class="grid grid-cols-3 gap-2 mb-6">
      <div class="bg-blue-50 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-primary" id="homeSolved">0</div>
        <div class="text-xs text-gray-500">已刷题</div>
      </div>
      <div class="bg-green-50 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-success" id="homeAccuracy">-</div>
        <div class="text-xs text-gray-500">正确率</div>
      </div>
      <div class="bg-red-50 rounded-xl p-3 text-center">
        <div class="text-xl font-bold text-danger" id="homeWrong">0</div>
        <div class="text-xs text-gray-500">错题数</div>
      </div>
    </div>

    <!-- Mode Cards -->
    <button onclick="startFreePractice()" class="w-full text-left mb-3 bg-gradient-to-r from-blue-50 to-blue-100 rounded-xl p-4 active:scale-[0.98] transition-transform">
      <div class="text-lg font-semibold text-primary">📝 自由练习</div>
      <div class="text-sm text-gray-500 mt-1">逐题作答，即时反馈，适合日常刷题</div>
    </button>
    <button onclick="showExamConfig()" class="w-full text-left mb-3 bg-gradient-to-r from-amber-50 to-amber-100 rounded-xl p-4 active:scale-[0.98] transition-transform">
      <div class="text-lg font-semibold text-warning">📋 模拟考试</div>
      <div class="text-sm text-gray-500 mt-1">限时作答，提交计分，支持各题型混合出题</div>
    </button>
    <button onclick="showSectionPicker()" class="w-full text-left mb-3 bg-gradient-to-r from-purple-50 to-purple-100 rounded-xl p-4 active:scale-[0.98] transition-transform">
      <div class="text-lg font-semibold text-purple-600">📂 知识点刷题</div>
      <div class="text-sm text-gray-500 mt-1">按章节/知识点专项练习</div>
    </button>
    <button onclick="goToWrongQuestions()" class="w-full text-left bg-gradient-to-r from-red-50 to-red-100 rounded-xl p-4 active:scale-[0.98] transition-transform">
      <div class="text-lg font-semibold text-danger">📌 错题集</div>
      <div class="text-sm text-gray-500 mt-1">回顾错题，AI 帮你解析</div>
    </button>
  </div>

  <!-- ========== 2. PRACTICE VIEW (练习 / 考试 / 知识点共用) ========== -->
  <div id="practiceView" class="page-view px-4 pt-4">
    <!-- Progress bar -->
    <div class="flex items-center gap-2 mb-1">
      <span id="pracProgress" class="text-xs text-gray-500"></span>
      <div class="flex-1 bg-gray-200 rounded-full h-2">
        <div id="pracProgressBar" class="bg-primary rounded-full h-2 transition-all" style="width:0%"></div>
      </div>
      <span id="pracTimer" class="text-xs text-gray-500 hidden"></span>
    </div>

    <!-- Question navigator toggle (practice mode) -->
    <div id="pracNavContainer" class="hidden mb-3">
      <button id="pracNavToggle" onclick="toggleNavigator()" class="text-xs text-primary font-medium flex items-center gap-1 mb-1 active:opacity-70">
        <span id="pracNavIcon">▶</span> <span id="pracNavLabel">显示题号</span>
        <span id="pracNavCount" class="text-gray-400"></span>
      </button>
      <div id="pracNavigator" class="hidden max-h-60 overflow-y-auto pb-1" style="scrollbar-width:thin"></div>
    </div>

    <!-- Question card -->
    <div id="pracQuestionCard" class="border border-gray-200 rounded-xl p-4 mb-4 fade-in">
      <span id="pracQType" class="inline-block text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 mb-2"></span>
      <p id="pracQuestion" class="text-base leading-relaxed mb-4"></p>
      <div id="pracMedia" class="hidden grid grid-cols-2 gap-2 mb-4"></div>
      <!-- Options -->
      <div id="pracOptions" class="space-y-2"></div>
      <button id="multiConfirmBtn" onclick="confirmMultipleAnswer()" class="hidden mt-3 w-full py-2.5 bg-primary text-white rounded-xl text-sm font-medium">确认多选答案</button>
      <!-- Feedback -->
      <div id="pracFeedback" class="hidden mt-4"></div>
    </div>

    <!-- Action buttons -->
    <div class="flex gap-2" id="pracActions">
      <button id="pracPrevBtn" onclick="prevQuestion()" class="flex-1 py-3 border border-gray-300 rounded-xl text-gray-600 font-medium active:bg-gray-100 hidden">上一题</button>
      <button id="pracNextBtn" onclick="nextQuestion()" class="flex-1 py-3 bg-primary text-white rounded-xl font-medium active:bg-primary-dark hidden">下一题 →</button>
    </div>

    <!-- Submit for exam -->
    <button id="examSubmitBtn" onclick="submitExam()" class="hidden w-full py-3 bg-warning text-white rounded-xl font-medium mt-4">提交答案</button>

    <!-- Exam result -->
    <div id="examResult" class="hidden mt-4 p-4 bg-gray-100 rounded-xl text-center"></div>
  </div>

  <!-- ========== 3. STATS VIEW ========== -->
  <div id="statsView" class="page-view px-4 pt-4">
    <h2 class="text-lg font-semibold mb-4">📊 学习统计</h2>
    <div class="grid grid-cols-2 gap-3 mb-6">
      <div class="bg-blue-50 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-primary" id="statsSolved">0</div><div class="text-xs text-gray-500">已刷题数</div>
      </div>
      <div class="bg-green-50 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-success" id="statsCorrect">0</div><div class="text-xs text-gray-500">答对题数</div>
      </div>
      <div class="bg-red-50 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-danger" id="statsWrong">0</div><div class="text-xs text-gray-500">做错题数</div>
      </div>
      <div class="bg-yellow-50 rounded-xl p-4 text-center">
        <div class="text-2xl font-bold text-warning" id="statsAccuracy">-</div><div class="text-xs text-gray-500">正确率</div>
      </div>
    </div>
    <!-- Per-section accuracy -->
    <h3 class="text-sm font-semibold text-gray-500 mb-2">各章节正确率</h3>
    <div id="statsBySection" class="space-y-2"></div>
    <button onclick="resetStats()" class="w-full mt-4 py-2 border border-danger text-danger rounded-xl text-sm">重置学习记录</button>
  </div>

  <!-- ========== 4. EXAM HISTORY VIEW ========== -->
  <div id="historyView" class="page-view px-4 pt-4">
    <h2 class="text-lg font-semibold mb-4">📋 模拟考试记录</h2>
    <div id="historyList" class="space-y-2"></div>
  </div>

  <!-- ========== 5. EXAM HISTORY DETAIL VIEW ========== -->
  <div id="historyDetailView" class="page-view px-4 pt-4 hidden">
    <div class="flex items-center gap-3 mb-4">
      <button onclick="switchTab('history')" class="text-lg active:opacity-60">← 返回</button>
      <h2 class="text-lg font-semibold" id="historyDetailTitle">考试详情</h2>
    </div>
    <div id="historyDetailContent" class="space-y-3"></div>
  </div>

  <!-- ========== 6. WRONG QUESTIONS VIEW ========== -->
  <div id="wrongView" class="page-view px-4 pt-4">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold">📌 错题集</h2>
      <button onclick="clearWrongQuestions()" class="text-xs text-danger border border-danger rounded-lg px-2 py-1">清空</button>
    </div>
    <div id="wrongList" class="space-y-3"></div>
    <div id="wrongEmpty" class="text-center py-12 text-gray-400">
      <div class="text-4xl mb-2">🎉</div>
      <p>暂无错题，继续加油！</p>
    </div>
    <!-- Wrong question detail modal -->
    <div id="wrongDetail" class="hidden mt-4 border border-gray-200 rounded-xl p-4">
      <p id="wrongDetailQ" class="text-sm mb-3"></p>
      <div id="wrongDetailOpts" class="space-y-1 text-sm"></div>
      <div class="mt-3 text-sm">
        <span class="text-gray-500">你的答案：</span><span id="wrongDetailYour" class="text-danger font-semibold"></span>
        <span class="text-gray-500 ml-4">正确答案：</span><span id="wrongDetailCorrect" class="text-success font-semibold"></span>
      </div>
      <button id="wrongAiBtn" onclick="requestAiAnalysis()" class="mt-3 w-full py-2 bg-gradient-to-r from-blue-500 to-purple-500 text-white rounded-xl text-sm font-medium active:opacity-80">
        🤖 AI 解析
      </button>
      <div id="wrongAiResult" class="hidden ai-response text-sm"></div>
      <div id="wrongAiLoading" class="hidden text-center py-4 ai-loading text-gray-400 text-sm">AI 正在分析...</div>
    </div>
  </div>

  <!-- ========== 5. SETTINGS VIEW ========== -->
  <div id="settingsView" class="page-view px-4 pt-4">
    <h2 class="text-lg font-semibold mb-4">⚙️ 设置</h2>
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-700">DeepSeek API Key</label>
        <input id="apiKeyInput" type="password" placeholder="sk-..." class="mt-1 w-full border border-gray-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary/30">
        <p class="text-xs text-gray-400 mt-1">用于错题 AI 解析，Key 仅存储在本地浏览器</p>
      </div>
      <button onclick="saveApiKey()" class="w-full py-2 bg-primary text-white rounded-xl text-sm">保存 API Key</button>
      <hr class="border-gray-200">
      <div class="text-xs text-gray-400">
        <p>当前题库：<span id="settingsBankTitle">-</span></p>
        <p>题库来源：<span id="settingsBankSource">-</span></p>
        <p>题目数量：<span id="settingsTotalQ">0</span> 题</p>
        <p class="mt-1">AI 解析模型：deepseek-v4-flash</p>
      </div>
    </div>
  </div>

  <!-- ========== BOTTOM TAB BAR ========== -->
  <nav class="tab-bar w-full bg-white border-t border-gray-200 flex justify-around py-2 px-4 z-50">
    <button onclick="switchTab('home')" data-tab="home" class="flex flex-col items-center gap-0.5 text-xs text-primary">
      <span class="text-lg">🏠</span> 刷题
    </button>
    <button onclick="switchTab('stats')" data-tab="stats" class="flex flex-col items-center gap-0.5 text-xs text-gray-400">
      <span class="text-lg">📊</span> 统计
    </button>
    <button onclick="switchTab('history')" data-tab="history" class="flex flex-col items-center gap-0.5 text-xs text-gray-400">
      <span class="text-lg">📋</span> 考试
    </button>
    <button onclick="switchTab('wrong')" data-tab="wrong" class="flex flex-col items-center gap-0.5 text-xs text-gray-400">
      <span class="text-lg">📌</span> 错题集
    </button>
    <button onclick="switchTab('settings')" data-tab="settings" class="flex flex-col items-center gap-0.5 text-xs text-gray-400">
      <span class="text-lg">⚙️</span> 设置
    </button>
  </nav>

  <!-- ========== KNOWLEDGE POINT DRAWER ========== -->
  <div id="sectionDrawer" class="drawer">
    <div class="drawer-content">
      <div class="sticky top-0 bg-primary text-white px-4 py-3 flex items-center gap-3">
        <button onclick="closeSectionDrawer()" class="text-xl">&times;</button>
        <span class="font-semibold">选择知识点</span>
      </div>
      <div id="sectionTree" class="p-4 space-y-1"></div>
      <div class="p-4 border-t border-gray-100">
        <button onclick="startSectionPractice()" class="w-full py-3 bg-primary text-white rounded-xl font-medium" disabled id="sectionStartBtn">开始刷题（请先选择）</button>
        <p id="sectionCount" class="text-xs text-gray-400 mt-2 text-center"></p>
      </div>
    </div>
    <div class="flex-1" onclick="closeSectionDrawer()"></div>
  </div>

  <!-- ========== EXAM CONFIG MODAL ========== -->
  <div id="examModal" class="drawer">
    <div class="flex items-center justify-center h-full" onclick="closeExamConfig()">
      <div class="bg-white rounded-2xl p-5 mx-4 w-full max-w-sm" onclick="event.stopPropagation()">
        <h3 class="font-semibold text-lg mb-4">模拟考试设置</h3>
        <div class="mb-3">
          <label class="text-sm text-gray-600">题型</label>
          <select id="examType" class="w-full border border-gray-300 rounded-xl px-3 py-2 mt-1 text-sm" onchange="onExamTypeChange()">
            <option value="mixed" selected>混合出题</option>
            <option value="single">仅单选题</option>
            <option value="multiple">仅多选题</option>
            <option value="judge">仅判断题</option>
          </select>
        </div>
        <div class="mb-3" id="examCountMixed">
          <label class="text-sm text-gray-600">题目数量</label>
          <div class="grid grid-cols-3 gap-2 mt-1">
            <div>
              <span class="text-xs text-gray-400">单选题</span>
              <input id="examSingleCount" type="number" min="0" max="600" value="30" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
              <span class="text-xs text-gray-400">多选题</span>
              <input id="examMultipleCount" type="number" min="0" max="500" value="0" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
              <span class="text-xs text-gray-400">判断题</span>
              <input id="examJudgeCount" type="number" min="0" max="400" value="20" class="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm">
            </div>
          </div>
        </div>
        <div class="mb-3 hidden" id="examCountSimple">
          <label class="text-sm text-gray-600">题目数量</label>
          <div class="flex gap-2 mt-1">
            <button onclick="setExamCount(20)" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm active:bg-gray-100" data-exam-ct="20">20题</button>
            <button onclick="setExamCount(50)" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm active:bg-gray-100" data-exam-ct="50">50题</button>
            <button onclick="setExamCount(100)" class="flex-1 py-2 border border-gray-300 rounded-lg text-sm active:bg-gray-100" data-exam-ct="100">100题</button>
          </div>
          <input id="examCountCustom" type="number" min="5" max="200" placeholder="自定义数量" class="w-full border border-gray-300 rounded-xl px-3 py-2 mt-1 text-sm">
        </div>
        <div class="mb-4">
          <label class="text-sm text-gray-600">限时（分钟，0=不限）</label>
          <input id="examTime" type="number" min="0" max="180" value="30" class="w-full border border-gray-300 rounded-xl px-3 py-2 mt-1 text-sm">
        </div>
        <button onclick="startExam()" class="w-full py-3 bg-warning text-white rounded-xl font-medium">开始考试</button>
        <button onclick="closeExamConfig()" class="w-full py-2 text-gray-500 text-sm mt-1">取消</button>
      </div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
